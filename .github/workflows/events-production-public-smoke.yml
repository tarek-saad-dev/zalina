name: Production public read-only smoke
on:
  push:
    branches: [codex/issue-32]
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify script syntax
        run: node --check scripts/event-production-public-smoke.cjs
      - name: Read-only public HTTP checks
        run: node scripts/event-production-public-smoke.cjs
      - name: Install browser QA dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify actual public browser interaction
        run: node scripts/event-production-browser.cjs
      - name: Upload public QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-events-browser-evidence
          path: artifacts/event-production-browser/
          if-no-files-found: ignore
          retention-days: 7
