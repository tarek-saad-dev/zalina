name: Deploy Zalina Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: zalina-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZALINA_VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.ZALINA_VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.ZALINA_VPS_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes zalina@"$SSH_HOST"

      - name: Verify production
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 https://zalinaarabianvillage.com/ > /dev/null
          echo "Production verification passed."

  authorize:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      action: ${{ steps.authorize.outputs.action }}
      target_sha: ${{ steps.authorize.outputs.target_sha }}
      target_ref: ${{ steps.authorize.outputs.target_ref }}
      issue_title: ${{ steps.authorize.outputs.issue_title }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Authorize command
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BODY: ${{ github.event.comment.body }}
          NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: ./.github/scripts/codex-control.sh authorize

      - name: Upload authorized context
        if: steps.authorize.outputs.allowed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: control-context
          path: control-context/
          if-no-files-found: error
          retention-days: 1






  codex:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on:
      - self-hosted
      - codex
      - zalina
    steps:
      - name: Checkout exact authorized target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Download authorized context
        uses: actions/download-artifact@v4
        with:
          name: control-context
          path: ${{ runner.temp }}/control-context

      - name: Load trusted control script
        run: |
          git fetch origin main --no-tags
          git show origin/main:.github/scripts/codex-control.sh > "$RUNNER_TEMP/codex-control.sh"
          chmod 700 "$RUNNER_TEMP/codex-control.sh"

      - name: Run Codex safely
        env:
          CONTROL_ACTION: ${{ needs.authorize.outputs.action }}
          CONTROL_CONTEXT_DIR: ${{ runner.temp }}/control-context
          CODEX_OUTPUT_DIR: ${{ runner.temp }}/codex-output
        run: |
          "$RUNNER_TEMP/codex-control.sh" run
          "$RUNNER_TEMP/codex-control.sh" emit-log




  finalize:
    needs:
      - authorize
      - codex
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          fetch-depth: 0

      - name: Load trusted control script
        run: |
          git fetch origin main --no-tags
          git show origin/main:.github/scripts/codex-control.sh > "$RUNNER_TEMP/codex-control.sh"
          chmod 700 "$RUNNER_TEMP/codex-control.sh"

      - name: Validate token env
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "token-env-ok"
